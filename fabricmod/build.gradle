plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    fabricRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

loom {
    accessWidenerPath = file('src/main/resources/mizulune.classtweaker')

    runs {
        client {
            client()
            name 'Mizulune Fabric Client'
            runDir 'run'
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', '../src/main/resources']
            exclude 'META-INF/**'
            exclude 'mapping.srg'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // These are external mods: available in development and staged beside Mizulune,
    // but never nested into the Mizulune JAR. Immutable version IDs keep the matrix reproducible.
    runtimeOnly "maven.modrinth:AANobbMI:${project.sodium_version_id}"
    runtimeOnly "maven.modrinth:YL57xq9U:${project.iris_version_id}"
    runtimeOnly "maven.modrinth:rIC2XJV4:${project.viafabricplus_version_id}"
    fabricRuntimeMods("maven.modrinth:AANobbMI:${project.sodium_version_id}") { transitive = false }
    fabricRuntimeMods("maven.modrinth:YL57xq9U:${project.iris_version_id}") { transitive = false }
    fabricRuntimeMods("maven.modrinth:rIC2XJV4:${project.viafabricplus_version_id}") { transitive = false }

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.4'

    include implementation('org.jetbrains.skiko:skiko-awt:0.148.1')
    include implementation('org.jetbrains.skiko:skiko-awt-runtime-windows-x64:0.148.1')
    include implementation('org.jetbrains.kotlin:kotlin-stdlib:2.3.20')
    include implementation('org.antlr:antlr4-runtime:4.9.1')
    include implementation('com.googlecode.soundlibs:mp3spi:1.9.5.4') {
        exclude group: 'junit', module: 'junit'
    }
    include implementation('com.googlecode.soundlibs:jlayer:1.0.1.4')
    include implementation('com.googlecode.soundlibs:tritonus-share:0.3.7.4')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('stageFabricMod', Copy) {
    group = 'distribution'
    description = 'Build and stage the Fabric 26.2 mod under the root build/mod-dist directory.'
    dependsOn tasks.named('build')
    doFirst {
        project.delete(fileTree('../build/mod-dist/fabric') {
            include 'mizulune-fabric-*.jar'
        })
    }
    from tasks.named('jar').flatMap { it.archiveFile }
    into file('../build/mod-dist/fabric')
}

tasks.register('stageFabricRuntimeMods', Copy) {
    group = 'distribution'
    description = 'Stage the pinned Sodium, Iris, and ViaFabricPlus runtime mods beside Mizulune.'
    dependsOn 'verifyFabricRuntimeMods'
    doFirst {
        project.delete(fileTree('../build/mod-dist/fabric') {
            include 'sodium-*.jar'
            include 'iris-*.jar'
            include 'ViaFabricPlus-*.jar'
            include 'AANobbMI-*.jar'
            include 'YL57xq9U-*.jar'
            include 'rIC2XJV4-*.jar'
        })
    }
    from configurations.fabricRuntimeMods
    eachFile { details ->
        if (details.name.startsWith('AANobbMI-')) details.name = 'sodium-fabric-0.9.1+mc26.2.jar'
        if (details.name.startsWith('YL57xq9U-')) details.name = 'iris-fabric-1.11.2+mc26.2.jar'
        if (details.name.startsWith('rIC2XJV4-')) details.name = 'ViaFabricPlus-4.6.1.jar'
    }
    into file('../build/mod-dist/fabric')
}

tasks.register('verifyFabricRuntimeMods') {
    group = 'verification'
    description = 'Verify the immutable Sodium, Iris, and ViaFabricPlus runtime artifacts.'
    inputs.files(configurations.fabricRuntimeMods)
    inputs.property('sodiumSha512', project.sodium_sha512)
    inputs.property('irisSha512', project.iris_sha512)
    inputs.property('viaFabricPlusSha512', project.viafabricplus_sha512)
    doLast {
        def expected = [
            'AANobbMI-': project.sodium_sha512,
            'YL57xq9U-': project.iris_sha512,
            'rIC2XJV4-': project.viafabricplus_sha512
        ]
        configurations.fabricRuntimeMods.files.each { artifact ->
            def entry = expected.find { prefix, ignored -> artifact.name.startsWith(prefix) }
            if (entry == null) throw new GradleException("Unexpected Fabric runtime artifact: ${artifact.name}")
            def digest = java.security.MessageDigest.getInstance('SHA-512')
                .digest(artifact.bytes).encodeHex().toString()
            if (!digest.equalsIgnoreCase(entry.value.toString())) {
                throw new GradleException("SHA-512 mismatch for ${artifact.name}: ${digest}")
            }
        }
    }
}

apply from: 'gradle/fabric26-source-compat.gradle'
