                .replace('stack.isEdible()', 'shit.zen.fabric.game.FabricItemCompat.isEdible(stack)')
                .replace('mc.level.getBlockState(blockPos).isSolidRender(mc.level, blockPos)',
                    'mc.level.getBlockState(blockPos).isSolidRender()')
                .replace('block.getSoundType(block.defaultBlockState())',
                    'block.defaultBlockState().getSoundType()')
                .replace('e.canBeCollidedWith() && e != projectile.getOwner()',
                    'e.canBeCollidedWith(projectile) && e != projectile.getOwner()')
                .replace('!other.canBeCollidedWith() || other.equals(localPlayer)',
                    '!other.canBeCollidedWith(localPlayer) || other.equals(localPlayer)')
                .replace('Arrow arrow = new Arrow(mc.level, x, y, z);',
                    'Arrow arrow = new Arrow(net.minecraft.world.entity.EntityTypes.ARROW, mc.level); arrow.setPos(x, y, z);')
                .replace('mc.font.drawInBatch(fuseLabel, -textWidth / 2.0f, 0.0f, -1, false, poseStack.last().pose(), mc.gameRenderer.renderBuffers(), Font.DisplayMode.NORMAL, 0, 0xF000F0);',
                    'shit.zen.fabric.render.FabricRenderBridge.submitWorldText(poseStack, fuseLabel, -textWidth / 2.0f, 0.0f, -1, 0xF000F0);')
            return migrated
        }
    }

    filesMatching('shit/zen/utils/rotation/MovementCorrectionUtil.java') {
        filter { String line ->
            line.replace('input.getMoveVector().y()', 'input.forwardImpulse()')
        }
    }

    filesMatching('shit/zen/utils/rotation/RotationHandler.java') {
        filter { String line ->
            line.replace('                    onGround);',
                '                    onGround, mc.player.horizontalCollision);')
                .replace('                        mc.player.onGround());',
                    '                        mc.player.onGround(), mc.player.horizontalCollision);')
        }
    }

    filesMatching('shit/zen/hud/ScoreboardHud.java') {
        filter { String line ->
            line
                .replace('import net.minecraft.world.scores.Score;',
                    'import net.minecraft.world.scores.PlayerScoreEntry;')
                .replace('ChatFormatting color = playerTeam.getColor();',
                    'java.util.Optional<net.minecraft.world.scores.TeamColor> color = playerTeam.getColor();')
                .replace('int colorId = color.getId();',
                    'int colorId = color.map(value -> value.displaySlot().id()).orElse(-1);')
                .replace('teamObjective = scoreboard.getDisplayObjective(3 + colorId);',
                    'teamObjective = color.map(net.minecraft.world.scores.TeamColor::displaySlot).map(scoreboard::getDisplayObjective).orElse(null);')
                .replace('net.minecraft.world.scores.Scoreboard.DISPLAY_SLOT_SIDEBAR',
                    'net.minecraft.world.scores.DisplaySlot.SIDEBAR')
                .replace('Collection<Score> scores = scoreboard.getPlayerScores(objective);',
                    'Collection<PlayerScoreEntry> scores = scoreboard.listPlayerScores(objective);')
                .replace('List<Score> visibleScores', 'List<PlayerScoreEntry> visibleScores')
                .replace('Score score =', 'PlayerScoreEntry score =')
                .replace('score.getOwner()', 'score.owner()')
                .replace('score.getScore()', 'score.value()')
        }
    }

    filesMatching('shit/zen/utils/render/RenderUtil.java') {
        filter { String line ->
            line
                .replace('mc.getMainRenderTarget()', 'mc.gameRenderer.mainRenderTarget()')
                .replace(', Minecraft.ON_OSX);', ');')
                .replaceAll('([A-Za-z0-9_.]+)\\.bindWrite\\(false\\);',
                    'shit.zen.fabric.render.LegacyRenderSystem.bindRenderTarget($1);')
                .replace('textureTarget.getColorTextureId()',
                    'shit.zen.fabric.render.LegacyRenderSystem.rawTextureId(textureTarget.getColorTexture())')
                .replace('new TextureTarget(1920, 1024, false, Minecraft.ON_OSX)',
                    'new TextureTarget("mizulune_legacy_blur", 1920, 1024, false, com.mojang.blaze3d.GpuFormat.RGBA8_UNORM)')
        }
    }
}

