plugins {
	id "fabric-loom" version "1.9.2"
	id "maven-publish"
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

configurations {
	api.extendsFrom library
}

allprojects {
	repositories {
		mavenCentral()
		maven {
			name = "Jitpack"
			url = "https://jitpack.io"
		}
		maven {
			name = "ViaVersion"
			url = "https://repo.viaversion.com"
		}
		maven {
			name = "Lenni0451 releases"
			url = "https://maven.lenni0451.net/releases"
		}
		maven {
			name = "Lenni0451 snapshots"
			url = "https://maven.lenni0451.net/snapshots"
		}
		maven {
			name = "TerraformersMC"
			url = "https://maven.terraformersmc.com/releases"
		}
		maven {
			name = "OpenCollab Snapshots"
			url = "https://repo.opencollab.dev/maven-snapshots/"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"

	library ("net.raphimc:ViaLoader:${project.vialoader_version}") {
		exclude group: "org.slf4j", module: "slf4j-api"
	}

	library "com.viaversion:viaversion:${project.viaversion_version}"
	library ("com.viaversion:viabackwards-common:${project.viabackwards_version}") {
		exclude group: "com.viaversion", module: "viaversion"
		exclude group: "io.netty", module: "netty-all"
		exclude group: "com.google.guava", module: "guava"
	}

	library "de.florianmichael:Classic4J:${project.classic4j_version}"
	library ("net.raphimc:ViaLegacy:${project.vialegacy_version}") {
		exclude group: "com.google.code.gson", module: "gson"
	}
	library "net.raphimc:ViaAprilFools:${project.viaaprilfools_version}"
	library ("net.raphimc:ViaBedrock:${project.viabedrock_version}") {
		exclude group: "net.lenni0451.mcstructs", module: "text"
		exclude group: "io.jsonwebtoken", module: "jjwt-impl"
		exclude group: "io.jsonwebtoken", module: "jjwt-gson"
		exclude group: "com.mojang", module: "brigadier"
	}
	library ("net.raphimc:MinecraftAuth:${project.minecraftauth_version}") {
		exclude group: "com.google.code.gson", module: "gson"
		exclude group: "org.slf4j", module: "slf4j-api"
	}
	library ("net.lenni0451.mcstructs:text:${project.mcstructs_text_version}") {
		exclude group: "com.google.code.gson", module: "gson"
	}
	library ("org.cloudburstmc.netty:netty-transport-raknet:${project.raknet_transport_version}") {
		exclude group: "io.netty", module: "netty-common"
		exclude group: "io.netty", module: "netty-buffer"
		exclude group: "io.netty", module: "netty-codec"
		exclude group: "io.netty", module: "netty-transport"
	}
	library "net.lenni0451:Reflect:${project.reflect_version}"

	include implementation(annotationProcessor("com.github.llamalad7.mixinextras:mixinextras-fabric:${project.mixin_extras_version}"))
}

loom {
	accessWidenerPath = file("src/main/resources/viafabricplus.accesswidener")
}

dependencies {
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	dependsOn configurations.library
	from {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
		configurations.library.collect {
			zipTree(it)
		}
	} {
		exclude "META-INF/*.RSA", "META-INF/*.SF", "META-INF/*.DSA"
	}
	from("LICENSE") { rename { "${it}_${project.archivesBaseName}" } }
}

publishing {
	repositories {
		maven {
			name = "Via"
			url = "https://repo.viaversion.com/"
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
	publications {
		maven(MavenPublication) {
			groupId = project.maven_group
			artifactId = project.archives_base_name
			version = project.mod_version

			from components.java
		}
	}
}

tasks.register("stageProtocolMod", Copy) {
	group = "distribution"
	description = "Build and stage the complete ViaFabricPlus fork beside the Mizulune Fabric jar."
	dependsOn tasks.named("build")
	doFirst {
		project.delete(fileTree("../build/mod-dist/fabric") {
			include "viafabricplus-*.jar"
			include "mizulune-viafabricplus-*.jar"
		})
	}
	from tasks.named("remapJar").flatMap { it.archiveFile }
	into file("../build/mod-dist/fabric")
}

tasks.register("verifyProtocol766Payload") {
	group = "verification"
	description = "Verify the full ViaFabricPlus jar contains the original UI/runtime and protocol 766 model."
	dependsOn tasks.named("remapJar")
		doLast {
		def jarFile = tasks.named("remapJar").get().archiveFile.get().asFile
		def requiredEntries = [
				"io/github/openzen/via/OpenZenViaProtocol.class",
				"io/github/openzen/via/compat/EntityEffectPacketCompat.class",
				"de/florianmichael/viafabricplus/ViaFabricPlus.class",
				"de/florianmichael/viafabricplus/protocolhack/ProtocolHack.class",
				"de/florianmichael/viafabricplus/protocolhack/util/VersionRange.class",
				"de/florianmichael/viafabricplus/protocolhack/netty/ViaFabricPlusVLLegacyPipeline.class",
				"de/florianmichael/viafabricplus/definition/boat/BoatModel_1_8.class",
				"de/florianmichael/viafabricplus/definition/boat/BoatRenderer_1_8.class",
				"de/florianmichael/viafabricplus/screen/base/ProtocolSelectionScreen.class",
				"de/florianmichael/viafabricplus/screen/base/ForceVersionScreen.class",
				"de/florianmichael/viafabricplus/injection/mixin/base/MixinMultiplayerScreen.class",
				"de/florianmichael/viafabricplus/injection/mixin/fixes/minecraft/entity/MixinBoatEntity.class",
				"de/florianmichael/viafabricplus/injection/mixin/fixes/minecraft/entity/MixinEntityModels.class",
				"de/florianmichael/viafabricplus/injection/mixin/fixes/minecraft/entity/MixinEntityRenderDispatcher.class",
				"de/florianmichael/viafabricplus/injection/mixin/fixes/viaversion/protocol1_20to1_20_2/MixinEntityPacketRewriter1_20_2.class",
				"net/raphimc/vialoader/util/VersionEnum.class",
				"com/viaversion/viabackwards/protocol/protocol1_20to1_20_2/Protocol1_20To1_20_2.class",
				"com/viaversion/viabackwards/protocol/protocol1_20_2to1_20_3/Protocol1_20_2To1_20_3.class",
				"com/viaversion/viabackwards/protocol/protocol1_20_3to1_20_5/Protocol1_20_3To1_20_5.class",
				"viafabricplus.mixins.json",
				"viafabricplus.accesswidener",
				"assets/viafabricplus/lang/zh_hk.json",
				"assets/viafabricplus/textures/boat_1_8.png"
		]
		def archive = new java.util.zip.ZipFile(jarFile)
		try {
			def missing = requiredEntries.findAll { archive.getEntry(it) == null }
			if (!missing.isEmpty()) {
				throw new GradleException("ViaFabricPlus OpenZen 766 payload is incomplete: ${missing}")
			}
		} finally {
			archive.close()
		}
	}
}

tasks.named("check").configure {
	dependsOn tasks.named("verifyProtocol766Payload")
}
